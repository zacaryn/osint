# Optional self-host: one Node process serves API + built UI (same as `npm start` after `npm run build`).
# Production at https://osint.carnyx.dev runs on Vercel (static `dist/` + bundled `api/index.js`).
# Connect at https://dashboard.render.com → New → Blueprint → this repository.
services:
  - type: web
    name: osint-watch
    runtime: node
    plan: free
    buildCommand: npm ci && npm run test:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
